da3_cfg:
  # Core DA3 runtime
  # aux_policy / aux_policy_v2:
  #   model <- policy_node_cfg.cv_model.da3.model (or DEFAULT_DA3_MODEL when empty)
  model: "depth-anything/DA3-BASE"
  device: "cuda"
  rate: 30
  
  # aux_policy_v2: process_res <- env_cfg["da3_process_res"]
  # aux_policy:    process_res <- env_cfg.get("da3_process_res", 308)
  # current runtime/env.yaml is 308
  process_res: 308
  process_res_method: "upper_bound_resize"

  chunk_size: 64

  # Camera / metric scaling
  # aux_policy / aux_policy_v2 both compute:
  #   focal = 0.5 * (fx + fy)
  # from policy_node_cfg.realsense.color_intrinsics
  focal: 616.5355529785156
  fx: 616.4124755859375
  fy: 616.6586303710938
  cx: 323.9004821777344
  cy: 243.82867431640625

  # HuggingFace cache location (absolute real path)
  cache_dir: "/workspace/simulation/dexterity-interface-rl/dep/Depth-Anything-3-HAND/models/da3"

  trt:
    enabled: true
    precision: "fp16"  # fp16 | fp32
    min_block_size: 1
    workspace_size: 0
    max_aux_streams: null
    optimization_level: null

    # Strict mode: fail hard when build/partition is not fully TRT-compatible.
    require_full_compilation: true
    pass_through_build_failures: true

    # Batch profile
    # aux_policy / aux_policy_v2 call DA3 with a single RGB frame (N=1).
    use_dynamic_batch: false
    batch_size: 1
    min_batch_size: 1
    opt_batch_size: 1
    max_batch_size: 1

    # Input tensor shape used in aux_policy loops:
    # color_rgb_t: [1, H, W, 3], H=480, W=640
    input_height: 480
    input_width: 640

    # Engine artifact directory (absolute real path)
    engine_dir: "/workspace/simulation/dexterity-interface-rl/dep/Depth-Anything-3-HAND/models/da3/trt_engines"
